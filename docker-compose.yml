services:
  adp-dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Browser-accessible URL for client-side API calls
        NEXT_PUBLIC_ADP_API_URL: http://localhost:8080
    ports:
      - "3002:3000"
    environment:
      # Server-side URL for Next.js API rewrites
      ADP_API_URL: http://adp-server:8080
    depends_on:
      adp-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - adp-network
    restart: unless-stopped

  adp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      # Server configuration
      ADP_SERVER_PORT: "8080"
      ADP_SERVER_READ_TIMEOUT: "30s"
      ADP_SERVER_WRITE_TIMEOUT: "30s"
      ADP_SERVER_SHUTDOWN_TIMEOUT: "30s"

      # PostgreSQL
      ADP_DATABASE_POSTGRES_HOST: postgres
      ADP_DATABASE_POSTGRES_PORT: "5432"
      ADP_DATABASE_POSTGRES_DATABASE: adp
      ADP_DATABASE_POSTGRES_USERNAME: adp
      ADP_DATABASE_POSTGRES_PASSWORD: adp_dev_password

      # Redis
      ADP_DATABASE_REDIS_HOST: redis
      ADP_DATABASE_REDIS_PORT: "6379"
      ADP_DATABASE_REDIS_PASSWORD: redis_dev_password

      # Neo4j
      ADP_DATABASE_NEO4J_URI: bolt://neo4j:7687
      ADP_DATABASE_NEO4J_USERNAME: neo4j
      ADP_DATABASE_NEO4J_PASSWORD: neo4j_dev_password

      # Qdrant
      ADP_DATABASE_QDRANT_HOST: qdrant
      ADP_DATABASE_QDRANT_PORT: "6334"

      # ClickHouse
      ADP_DATABASE_CLICKHOUSE_HOST: clickhouse
      ADP_DATABASE_CLICKHOUSE_PORT: "9000"
      ADP_DATABASE_CLICKHOUSE_DATABASE: adp
      ADP_DATABASE_CLICKHOUSE_USERNAME: default
      ADP_DATABASE_CLICKHOUSE_PASSWORD: clickhouse_dev_password

      # Authentication (disabled for local dev)
      ADP_AUTH_JWKS_URL: ""
      ADP_AUTH_ISSUER: ""
      ADP_AUTH_AUDIENCE: ""

      # Rate limiting
      ADP_RATE_LIMIT_ENABLED: "true"
      ADP_RATE_LIMIT_REQUESTS_PER_SECOND: "10"
      ADP_RATE_LIMIT_BURST_SIZE: "20"

      # Logging
      ADP_LOG_LEVEL: debug
      ADP_LOG_FORMAT: text

      # Environment
      ADP_ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      clickhouse:
        condition: service_started
    healthcheck:
      test: [ "CMD", "/usr/local/bin/adp-cli", "health", "--quiet" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - adp-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: adp
      POSTGRES_PASSWORD: adp_dev_password
      POSTGRES_DB: adp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U adp -d adp" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adp-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redis_dev_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis_dev_password", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adp-network
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_dev_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - adp-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - adp-network
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    environment:
      CLICKHOUSE_DB: adp
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse_dev_password
    networks:
      - adp-network
    restart: unless-stopped

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - adp-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Optional: Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - adp-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  clickhouse_data:
  prometheus_data:
  grafana_data:


networks:
  adp-network:
    driver: bridge
