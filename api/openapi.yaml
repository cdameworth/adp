  /v1/admin/users/{id}:
    get:
      operationId: getUser
      summary: Get a user by ID (admin only)
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
