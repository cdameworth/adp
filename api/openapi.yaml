                  data:
                    $ref: "#/components/schemas/UserProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateUser
      summary: Update a user's role, status, or name (admin only)
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid role or status value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: disableUser
      summary: Disable a user account (admin only)
      description: Soft-deletes the user by setting status to disabled. Cannot disable your own account.
      tags: [Admin]
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: User disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "User disabled"
        "400":
          description: Cannot disable own account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/info:
    get:
      operationId: getApiInfo
      summary: API version and endpoint info
      description: Returns API metadata including version and available endpoint groups.
      tags: [System]
      security: []
      responses:
        "200":
          description: API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "ADP API"
                  version:
                    type: string
                    example: "1.0.0"
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string
                    example:
                      sessions: "/v1/sessions"
                      governance: "/v1/governance"
                      audit: "/v1/audit"
                      services: "/v1/services"
                      context: "/v1/context"

# =============================================================================
# Components
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT authentication via locally-generated tokens (POST /v1/auth/login)
        or external JWKS provider. Required in production (PostgreSQL mode).
        Optional in SQLite development mode.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Shared API key authentication. Set via ADP_API_KEY environment variable.

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Session ID

    DecisionId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Decision record ID

    ApprovalId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Approval (escalation) request ID

    PolicyId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Policy definition ID

    ServiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Service ID

    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: User ID

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 500
      description: Maximum number of items to return

    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip for pagination

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "not found"
            code: "not_found"
            details: null

    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "authentication required"
            code: "unauthorized"
            details: null

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "insufficient permissions"
            code: "forbidden"
            details: null

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error: "internal server error"
            code: "internal_error"
            details: null

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # -------------------------------------------------------------------------
    # Common
    # -------------------------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: Machine-readable error code
          enum:
            - bad_request
            - not_found
            - unauthorized
            - forbidden
            - internal_error
            - conflict
        details:
          description: Additional error context (nullable)
          oneOf:
            - type: object
            - type: "null"

    # -------------------------------------------------------------------------
    # Sessions
    # -------------------------------------------------------------------------
    Session:
      type: object
      properties:
        id:
          type: string
          description: Unique session identifier
        organization_id:
          type: string
          description: Organization that owns this session
        user_id:
          type: string
          description: User who started the session
        tool:
          type: string
          description: Agent tool name (e.g., claude-code, cursor, aider)
        trust_level:
          type: integer
          minimum: 1
          maximum: 5
          description: |
            Agent trust level (1-5). Higher levels unlock more autonomous actions.
            - 1: Observe only
            - 2: Suggest (default)
            - 3: Auto-apply safe changes
            - 4: Auto-apply with review
            - 5: Full autonomy
        capabilities:
          type: array
          items:
            type: string
          description: Granted agent capabilities (e.g., file_write, shell_execute)
        constraints:
          type: array
          items:
            type: string
          description: Active constraints on agent behavior
        service_scope:
          type: array
          items:
            type: string
          description: Service IDs the session is scoped to
        status:
          type: string
          enum: [active, ended, expired]
          description: Current session status
        started_at:
          type: string
          format: date-time
          description: When the session started
        expires_at:
          type: string
          format: date-time
          description: When the session will expire
        last_heartbeat:
          type: string
          format: date-time
          description: Last heartbeat timestamp from the agent

    SessionResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Session"

    SessionListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        total:
          type: integer
          description: Total number of matching sessions
        limit:
          type: integer
          description: Page size used
        offset:
          type: integer
          description: Offset used

    CreateSessionRequest:
      type: object
      required: [tool]
      properties:
        organization_id:
          type: string
          description: Organization ID (UUID in PostgreSQL mode)
        user_id:
          type: string
          description: User ID (UUID in PostgreSQL mode)
        tool:
          type: string
          description: Agent tool name
        trust_level:
          type: integer
          minimum: 1
          maximum: 5
          default: 2
          description: Initial trust level
        capabilities:
          type: array
          items:
            type: string
          description: Requested agent capabilities
        service_scope:
          type: array
          items:
            type: string
          description: Service IDs to scope the session to
        ttl_hours:
          type: integer
          default: 8
          minimum: 1
          description: Session time-to-live in hours

    UpdateSessionRequest:
      type: object
      properties:
        trust_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Updated trust level
        capabilities:
          type: array
          items:
            type: string
          description: Updated capabilities list
        constraints:
          type: array
          items:
            type: string
          description: Updated constraints list
        status:
          type: string
          description: Updated status

    # -------------------------------------------------------------------------
    # Context
    # -------------------------------------------------------------------------
    ContextRequest:
      type: object
      required: [session_id, task]
      properties:
        session_id:
          type: string
          description: Active session ID
        service_id:
          type: string
          description: Service the task targets (optional)
        task:
          type: string
          description: Natural-language description of the task
        token_budget:
          type: object
          properties:
            essential:
              type: integer
              default: 4000
            task_relevant:
              type: integer
              default: 12000
            supporting:
              type: integer
              default: 8000

    ContextLayer:
      type: object
      properties:
        content:
          type: string
        tokens:
          type: integer
        sources:
          type: array
          items:
            type: string

    ContextResult:
      type: object
      properties:
        session_id:
          type: string
        service_id:
          type: string
        task:
          type: string
        layers:
          type: object
          properties:
            essential:
              $ref: "#/components/schemas/ContextLayer"
            task_relevant:
              $ref: "#/components/schemas/ContextLayer"
            supporting:
              $ref: "#/components/schemas/ContextLayer"
        total_tokens:
          type: integer
        cache_hit:
          type: boolean
        retrieval_time_ms:
          type: integer
        degraded:
          type: boolean
          description: True when only the lightweight assembler ran (no vector retrieval).
        note:
          type: string

    # -------------------------------------------------------------------------
    # Documentation
    # -------------------------------------------------------------------------
    DocRecord:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        category:
          type: string
          enum: [session_summary, risk_report, pattern_report]
        title:
          type: string
        content:
          type: string
          description: Markdown content
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Enforcement
    # -------------------------------------------------------------------------
    Finding:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [ungoverned_commit]
        reference:
          type: string
          description: e.g. commit SHA
        repo:
          type: string
        ref:
          type: string
        author:
          type: string
        reason:
          type: string
        status:
          type: string
          enum: [open, acknowledged, resolved]
        detected_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Governance
    # -------------------------------------------------------------------------
    CheckActionRequest:
      type: object
      required: [session_id, action_type]
      properties:
        session_id:
          type: string
          description: Active session ID
        trust_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Trust level to evaluate against (overrides session default)
        action_type:
          type: string
          description: Type of action being checked (e.g., file_write, shell_execute, deploy)
        target:
          type: object
          additionalProperties: true
          description: Action target details (path, resource, etc.)
        context:
          type: object
          additionalProperties: true
          description: Additional context for policy evaluation

    CheckActionResult:
      type: object
      properties:
        allowed:
          type: boolean
          description: Whether the action is permitted
        requires_approval:
          type: boolean
          description: Whether human approval is required before proceeding
        denied_reasons:
          type: array
          items:
            type: string
          description: Reasons the action was denied (empty if allowed)
        policy_names:
          type: array
          items:
            type: string
          description: Names of policies that matched this action
        warnings:
          type: array
          items:
            type: string
          description: Non-blocking warnings about the action
        restrictions:
          type: array
          items:
            type: string
          description: Additional restrictions placed on the action

    RequestApprovalRequest:
      type: object
      required: [session_id, action, reason]
      properties:
        session_id:
          type: string
          description: Active session ID
        decision_id:
          type: string
          description: Related decision record ID (optional)
        action:
          type: string
          description: Human-readable description of the action
        action_type:
          type: string
          description: Action type category
        target:
          type: object
          additionalProperties: true
          description: Action target details
        reason:
          type: string
          description: Why the agent wants to perform this action
        policy_names:
          type: array
          items:
            type: string
          description: Policies that triggered the escalation
        context_summary:
          type: object
          additionalProperties: true
          description: Summary of the context for the approver
        priority:
          type: string
          enum: [low, normal, high, critical]
          default: "normal"
          description: Escalation priority

    ResolveApprovalRequest:
      type: object
      required: [approved]
      properties:
        approved:
          type: boolean
          description: Whether the action is approved
        comment:
          type: string
          description: Approver's comment or rationale

    EscalationRequest:
      type: object
      properties:
        id:
          type: string
          description: Unique escalation request ID
        session_id:
          type: string
        decision_id:
          type: string
          description: Related decision record ID
        action:
          type: string
          description: Action requiring approval
        action_type:
          type: string
        target:
          type: object
          additionalProperties: true
        reason:
          type: string
          description: Agent's reason for the action
        policy_names:
          type: array
          items:
            type: string
        context_summary:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [pending, approved, denied, expired]
        priority:
          type: string
          enum: [low, normal, high, critical]
        approver_id:
          type: string
          description: ID of the user who resolved the request
        approver_comment:
          type: string
          description: Comment from the approver
        requested_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          description: When the request was approved or denied

    EscalationListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EscalationRequest"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # -------------------------------------------------------------------------
    # Audit -- Decisions
    # -------------------------------------------------------------------------
    LogDecisionRequest:
      type: object
      required: [session_id, decision_type, action]
      properties:
        session_id:
          type: string
          description: Active session ID
        decision_type:
          type: string
          description: Category of decision (e.g., file_modification, shell_command, architecture)
        action:
          type: string
          description: Human-readable description of the action taken
        target:
          type: object
          additionalProperties: true
          description: What the action targets (file path, resource, etc.)
        reasoning:
          type: object
          additionalProperties: true
          description: Structured reasoning behind the decision
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          default: 0.8
          description: Agent's confidence in this decision (0.0 to 1.0)
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
          description: Other options the agent considered
        context_snapshot:
          type: object
          additionalProperties: true
          description: Snapshot of relevant context at decision time
        policy_result:
          $ref: "#/components/schemas/PolicyResult"

    Alternative:
      type: object
      properties:
        action:
          type: string
          description: Alternative action description
        reason:
          type: string
          description: Why this alternative was not chosen
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Confidence in this alternative

    PolicyResult:
      type: object
      properties:
        allowed:
          type: boolean
          description: Whether policy evaluation allowed the action
        denied_reasons:
          type: array
          items:
            type: string
          description: Reasons for denial
        policy_names:
          type: array
          items:
            type: string
          description: Policies that were evaluated

    DecisionRecord:
      type: object
      properties:
        id:
          type: string
          description: Unique decision record ID
        session_id:
          type: string
        decision_type:
          type: string
        action:
          type: string
        target:
          type: object
          additionalProperties: true
        reasoning:
          type: object
          additionalProperties: true
        confidence:
          type: number
          format: double
          minimum: 0
          maximum: 1
        alternatives:
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
        context_snapshot:
          type: object
          additionalProperties: true
        policy_result:
          $ref: "#/components/schemas/PolicyResult"
        status:
          type: string
          description: Decision execution status
        outcome:
          type: string
          description: Outcome after execution (success, failure, etc.)
        created_at:
          type: string
          format: date-time

    DecisionListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DecisionRecord"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # -------------------------------------------------------------------------
    # Commits
    # -------------------------------------------------------------------------
    PrepareCommitRequest:
      type: object
      required: [session_id, files]
      properties:
        session_id:
          type: string
          description: Active session ID
        files:
          type: array
          items:
            type: string
          minItems: 1
          description: List of staged file paths
        message:
          type: string
          description: Intended commit message

    PrepareCommitResult:
      type: object
      properties:
        commit_token:
          type: string
          description: Token to use when registering the commit after `git commit`
        approved:
          type: boolean
          description: Whether the commit is approved by policy evaluation
        reason:
          type: string
          description: Reason for approval or denial

    RegisterCommitRequest:
      type: object
      required: [commit_token, commit_sha]
      properties:
        commit_token:
          type: string
          description: Token from a prior `prepareCommit` call
        commit_sha:
          type: string
          description: Git commit SHA from the completed commit

    CommitRecord:
      type: object
      properties:
        id:
          type: string
          description: Unique commit record ID
        session_id:
          type: string
        commit_sha:
          type: string
          description: Git commit SHA
        commit_token:
          type: string
          description: Preparation token
        files:
          type: array
          items:
            type: string
          description: Files included in the commit
        message:
          type: string
          description: Commit message
        status:
          type: string
          description: Commit record status (prepared, committed, verified)
        approved:
          type: boolean
          description: Whether the commit was approved by policy
        approval_reason:
          type: string
          description: Reason for approval decision
        prepared_at:
          type: string
          format: date-time
        committed_at:
          type: string
          format: date-time
          description: When the commit was registered
        verified_at:
          type: string
          format: date-time
          description: When the commit was verified (PostgreSQL only; SQLite infers from status)

    VerifyCommitRequest:
      type: object
      required: [commit_sha]
      properties:
        commit_sha:
          type: string
          description: Git commit SHA to verify

    VerifyCommitResult:
      type: object
      properties:
        verified:
          type: boolean
          description: Whether the commit has a complete audit trail
        commit_sha:
          type: string
        session_id:
          type: string
          description: Session that produced this commit
        verified_at:
          type: string
          format: date-time
          description: Verification timestamp

    # -------------------------------------------------------------------------
    # Policies
    # -------------------------------------------------------------------------
    CreatePolicyRequest:
      type: object
      required: [name, category]
      properties:
        name:
          type: string
          description: Unique policy name
        description:
          type: string
          description: Human-readable policy description
        category:
          type: string
          description: Policy category (e.g., security, compliance, operational)
        enabled:
          type: boolean
          default: true
          description: Whether the policy is active
        priority:
          type: integer
          default: 0
          description: Evaluation priority (higher = evaluated first)
        policy_type:
          type: string
          enum: [builtin, rego, custom]
          description: Type of policy implementation
        rego_code:
          type: string
          description: OPA/Rego source code (for rego type policies)
        builtin_name:
          type: string
          description: |
            Name of the builtin evaluator (for builtin type policies).
            Available builtins: sensitive_files, blast_radius, off_hours,
            cost_limits, migration_approval, rate_limiting.
        config:
          type: object
          additionalProperties: true
          description: Policy-specific configuration
        min_trust_level:
          type: integer
          minimum: 1
          maximum: 5
          description: Minimum trust level required to bypass this policy
        tags:
          type: array
          items:
            type: string
          description: Tags for filtering and grouping
        metadata:
          type: object
          additionalProperties: true
          description: Arbitrary metadata

    UpdatePolicyRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        policy_type:
          type: string
          enum: [builtin, rego, custom]
        rego_code:
          type: string
        builtin_name:
          type: string
        config:
          type: object
          additionalProperties: true
        min_trust_level:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true

    PolicyDefinition:
      type: object
      properties:
        id:
          type: string
          description: Unique policy definition ID
        name:
          type: string
        description:
          type: string
        category:
          type: string
        enabled:
          type: boolean
        priority:
          type: integer
        policy_type:
          type: string
          enum: [builtin, rego, custom]
        rego_code:
          type: string
        builtin_name:
          type: string
        config:
          type: object
          additionalProperties: true
        min_trust_level:
          type: integer
          minimum: 1
          maximum: 5
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        trigger_count:
          type: integer
          description: Number of times this policy has been triggered
        last_triggered:
          type: string
          description: Relative time since last trigger (e.g., "5 minutes ago", "Never")
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PolicyDefinition"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    # -------------------------------------------------------------------------
    # Services
    # -------------------------------------------------------------------------
    CreateServiceRequest:
      type: object
      required: [name]
      properties:
        organization_id:
          type: string
          description: Owning organization ID
        name:
          type: string
          description: Service name
        description:
          type: string
          description: Service description
        tier:
          type: string
          description: Service tier (e.g., critical, standard, internal)
        agent_constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraint"
          description: Constraints applied to agents working on this service
        context_config:
          $ref: "#/components/schemas/ContextConfig"
        escalation_config:
          $ref: "#/components/schemas/EscalationConfig"
        spec:
          type: object
          additionalProperties: true
          description: Service specification metadata
        human_docs:
          type: string
          description: Human-readable documentation for agents

    UpdateServiceRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
        description:
          type: string
        tier:
          type: string
        agent_constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraint"
        context_config:
          $ref: "#/components/schemas/ContextConfig"
        escalation_config:
          $ref: "#/components/schemas/EscalationConfig"
        spec:
          type: object
          additionalProperties: true
        human_docs:
          type: string

    Service:
      type: object
      properties:
        id:
          type: string
          description: Unique service ID
        organization_id:
          type: string
        name:
          type: string
        description:
          type: string
        tier:
          type: string
        agent_constraints:
          type: array
          items:
            $ref: "#/components/schemas/AgentConstraint"
        context_config:
          $ref: "#/components/schemas/ContextConfig"
        escalation_config:
          $ref: "#/components/schemas/EscalationConfig"
        spec:
          type: object
          additionalProperties: true
        human_docs:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Service"

    ServiceListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Service"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    AgentConstraint:
      type: object
      properties:
        type:
          type: string
          description: Constraint type (e.g., file_restriction, command_restriction)
        description:
          type: string
          description: Human-readable constraint description
        severity:
          type: string
          description: Constraint severity (e.g., low, medium, high, critical)
        pattern:
          type: string
          description: Glob or regex pattern for matching (optional)

    ContextConfig:
      type: object
      description: Token budget configuration for agent context windows
      properties:
        essential_token_budget:
          type: integer
          description: Token budget for essential context
        task_relevant_token_budget:
          type: integer
          description: Token budget for task-relevant context
        supporting_token_budget:
          type: integer
          description: Token budget for supporting context
        include_paths:
          type: array
          items:
            type: string
          description: File paths to include in context
        exclude_paths:
          type: array
          items:
            type: string
          description: File paths to exclude from context
        priority_files:
          type: array
          items:
            type: string
          description: Files to prioritize in context loading

    EscalationConfig:
      type: object
      description: Configuration for escalation behavior
      properties:
        default_approvers:
          type: array
          items:
            type: string
          description: Default approver identifiers (email or user ID)
        timeout_minutes:
          type: integer
          description: Minutes before an escalation request expires
        auto_approve:
          type: boolean
          description: Whether to auto-approve if no response within timeout
        notify_on_escalate:
          type: boolean
          description: Whether to send notifications on escalation

    # -------------------------------------------------------------------------
    # Auth & Users
    # -------------------------------------------------------------------------
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: User email address
        name:
          type: string
          description: Display name
        password:
          type: string
          minLength: 8
          description: Password (minimum 8 characters)

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Refresh token from a prior login or refresh

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        access_token:
          type: string
          description: JWT access token (HMAC-SHA256, 15 minute TTL)
        refresh_token:
          type: string
          description: Refresh token (7 day TTL)
        expires_in:
          type: integer
          description: Access token lifetime in seconds
        token_type:
          type: string
          example: "Bearer"

    UserProfile:
      type: object
      properties:
        id:
          type: string
          description: User ID
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
          description: User role (first user is auto-admin)
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
        role:
          type: string
          enum: [admin, user]
        status:
          type: string
          enum: [active, disabled]

    UserListResponse:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserProfile"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
